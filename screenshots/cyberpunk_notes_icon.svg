<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Neon cyberpunk spiral notes app icon">
<defs>
  <radialGradient id="bg"><stop stop-color="#111735"/><stop offset=".72" stop-color="#09091e"/><stop offset="1" stop-color="#03030d"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef48fa"/><stop offset=".3" stop-color="#9945ff"/><stop offset=".67" stop-color="#19e9fd"/><stop offset="1" stop-color="#e932e9"/></linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60247f"/><stop offset=".25" stop-color="#24274c"/><stop offset=".68" stop-color="#101d3e"/><stop offset="1" stop-color="#6521a3"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff68ff"/><stop offset=".44" stop-color="#b051ff"/><stop offset=".73" stop-color="#29edff"/><stop offset="1" stop-color="#08deff"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1" y1="0" y2=".25"><stop stop-color="#300c61"/><stop offset=".2" stop-color="#e98aff"/><stop offset=".39" stop-color="#421b86"/><stop offset=".67" stop-color="#04bde9"/><stop offset=".84" stop-color="#182552"/><stop offset="1" stop-color="#f6a7ff"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#99f4ff"/><stop offset=".55" stop-color="#73d9ff"/><stop offset="1" stop-color="#f19bff"/></linearGradient>
  <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e75bff"/><stop offset=".48" stop-color="#8c2abe"/><stop offset="1" stop-color="#171e47"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="small" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="circle"><circle cx="512" cy="512" r="482"/></clipPath>
</defs>
